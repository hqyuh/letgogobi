services:
  # ======================================
  # POSTGRESQL
  # ======================================
  database:
    container_name: database
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kafka_hqh
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_MAX_CONNECTIONS: 200
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nest_network

  # ======================================
  # KAFKA (Apache Kafka, KRaft mode, 2 listeners)
  # ======================================
  kafka:
    container_name: kafka
    image: apache/kafka:latest
    restart: always
    ports:
      - '9094:9094' # external listener
    environment:
      # --- Node identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # --- LISTENERS ---
      # INTERNAL → for Kafka-UI and services in Docker
      # EXTERNAL → for NestJS / KafkaJS to run from HOST machine
      # CONTROLLER → requested by KRaft
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://:9093

      # Advertised listeners = Kafka tells the client where to connect
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Kafka broker use INTERNAL listener
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Controller config
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # KRaft log directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Topics config
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka-entrypoint.sh:/kafka-entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/kafka-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nest_network

  # ======================================
  # KAFKA UI
  # ======================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: 'false'
      KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nest_network

  # ======================================
  # REDIS
  # ======================================
  redis:
    container_name: redis # host connect redis-insight
    image: redis:8.4.0-alpine
    restart: always
    command: sh /redis-init.sh
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
      - ./redis-init.sh:/redis-init.sh:ro
    environment:
      - REDIS_USERNAME=redis-user
      - REDIS_PASSWORD=redis-password
    networks:
      - nest_network

  # ======================================
  # REDIS INSIGHT
  # ======================================
  redis-insight:
    container_name: redis-insight
    image: redislabs/redisinsight:latest
    ports:
      - 5540:5540
    volumes:
      - redis_insight:/data
    restart: always
    depends_on:
      - redis
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:5540 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nest_network
    environment:
      - REDISINSIGHT_DISABLE_AUTH=true
      - REDISINSIGHT_PASSWORD=redis-password
      - REDISINSIGHT_USERNAME=redis-user
      - REDISINSIGHT_REDIS_URL=redis:6379
      - REDISINSIGHT_REDIS_PASSWORD=redis-password
      - REDISINSIGHT_REDIS_USERNAME=redis-user

# ======================================
# VOLUMES
# ======================================
volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redis_insight:
    driver: local

# ======================================
# NETWORK
# ======================================
networks:
  nest_network:
    name: nest_network
    driver: bridge
