# ======================================
# SPILO (Patroni HA PostgreSQL) COMMON CONFIG
# Used for pg1..pg4. etcd makes DCS, HAProxy route write/read.
# ======================================
x-spilo-common: &spilo-common
  image: ghcr.io/zalando/spilo-17:4.0-p3
  restart: unless-stopped
  networks:
    - nest_network
  environment: &spilo-env
    SCOPE: pg-ha-cluster
    PGVERSION: '17'
    SPILO_PROVIDER: local

    # Superuser
    PGUSER_SUPERUSER: postgres
    PGPASSWORD_SUPERUSER: postgres

    # Admin user
    PGUSER_ADMIN: admin
    PGPASSWORD_ADMIN: admin

    # Replication user
    PGUSER_STANDBY: standby
    PGPASSWORD_STANDBY: standby

    # Spilo dùng etcd làm DCS
    ETCD_HOSTS: '"etcd1:2379","etcd2:2379","etcd3:2379"'

    # Dev/local cho dễ connect
    ALLOW_NOSSL: 'true'

    # Bật wal_level=logical để Debezium (CDC) đọc được từ primary.
    # Chỉ áp dụng khi bootstrap cluster mới (volumes trống).
    SPILO_CONFIGURATION: |
      bootstrap:
        dcs:
          postgresql:
            parameters:
              wal_level: logical
              max_wal_senders: 10
              max_replication_slots: 10
  depends_on:
    - etcd1
    - etcd2
    - etcd3

services:
  # ======================================
  # ETCD CLUSTER (DCS cho Patroni/Spilo)
  # ======================================
  etcd1:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcd1
    hostname: etcd1
    restart: unless-stopped
    networks:
      - nest_network
    volumes:
      - ./docker/docker-data/etcd/etcd1-data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=pg-ha-etcd
      - --initial-cluster-state=new
      - --enable-v2=true

  etcd2:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcd2
    hostname: etcd2
    restart: unless-stopped
    networks:
      - nest_network
    volumes:
      - ./docker/docker-data/etcd/etcd2-data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=pg-ha-etcd
      - --initial-cluster-state=new
      - --enable-v2=true

  etcd3:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcd3
    hostname: etcd3
    restart: unless-stopped
    networks:
      - nest_network
    volumes:
      - ./docker/docker-data/etcd/etcd3-data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=pg-ha-etcd
      - --initial-cluster-state=new
      - --enable-v2=true

  # ======================================
  # KAFKA (Apache Kafka, KRaft mode, 2 listeners)
  # ======================================
  kafka:
    container_name: kafka
    image: apache/kafka:latest
    restart: always
    ports:
      - '9094:9094' # external listener
    environment:
      # --- Node identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # --- LISTENERS ---
      # INTERNAL → for Kafka-UI and services in Docker
      # EXTERNAL → for NestJS / KafkaJS to run from HOST machine
      # CONTROLLER → requested by KRaft
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://:9093

      # Advertised listeners = Kafka tells the client where to connect
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Kafka broker use INTERNAL listener
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Controller config
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # KRaft log directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Topics config
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_NUM_PARTITIONS: 3

    volumes:
      - ./docker/docker-data/kafka:/var/lib/kafka/data
      - ./kafka-entrypoint.sh:/kafka-entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/kafka-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nest_network

  # ======================================
  # APICURIO REGISTRY - schema registry (Avro/JSON/Protobuf)
  # UI/API: http://localhost:8086
  # ccompat (Confluent wire format): http://localhost:8086/apis/ccompat/v7
  # ======================================
  apicurio-registry:
    image: apicurio/apicurio-registry:latest
    container_name: apicurio-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8086:8080'
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --silent --fail http://localhost:8080/apis/registry/v3/system/info || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - nest_network

  # ======================================
  # KAFKA UI
  # ======================================
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: 'false'
      KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE: 'true'
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio-registry:8080/apis/ccompat/v7
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
      debezium-connect:
        condition: service_healthy
    networks:
      - nest_network

  # ======================================
  # REDIS
  # ======================================
  redis2:
    container_name: redis2 # host connect redis-insight
    image: redis:8.4.0-alpine
    restart: always
    command: sh /redis-init.sh
    ports:
      - 6379:6379
    volumes:
      - ./docker/docker-data/redis:/data
      - ./redis-init.sh:/redis-init.sh:ro
    environment:
      - REDIS_USERNAME=redis-user
      - REDIS_PASSWORD=redis-password
    networks:
      - nest_network

  # ======================================
  # REDIS INSIGHT
  # ======================================
  redis-insight2:
    container_name: redis-insight2
    image: redislabs/redisinsight:latest
    ports:
      - 5540:5540
    volumes:
      - ./docker/docker-data/redis-insight:/data
    restart: always
    depends_on:
      - redis2
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:5540 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nest_network
    environment:
      - REDISINSIGHT_DISABLE_AUTH=true
      - REDISINSIGHT_PASSWORD=redis-password
      - REDISINSIGHT_USERNAME=redis-user
      - REDISINSIGHT_REDIS_URL=redis:6379
      - REDISINSIGHT_REDIS_PASSWORD=redis-password
      - REDISINSIGHT_REDIS_USERNAME=redis-user

  # ======================================
  # POSTGRES HA (Spilo/Patroni) - 4 nodes
  # 1 leader (primary) + 3 replicas, automatic failover via etcd.
  # App/Prisma & Debezium connect via HAProxy (not direct node).
  # ======================================
  pg1:
    <<: *spilo-common
    container_name: pg1
    hostname: pg1
    environment:
      <<: *spilo-env
      RESTAPI_CONNECT_ADDRESS: pg1:8008
      PG_CONNECT_ADDRESS: pg1:5432
    ports:
      - '5433:5432'
      - '8001:8008'
    volumes:
      - ./docker/docker-data/postgres/pg1-data:/home/postgres/pgdata

  pg2:
    <<: *spilo-common
    container_name: pg2
    hostname: pg2
    environment:
      <<: *spilo-env
      RESTAPI_CONNECT_ADDRESS: pg2:8008
      PG_CONNECT_ADDRESS: pg2:5432
    ports:
      - '5434:5432'
      - '8002:8008'
    volumes:
      - ./docker/docker-data/postgres/pg2-data:/home/postgres/pgdata

  pg3:
    <<: *spilo-common
    container_name: pg3
    hostname: pg3
    environment:
      <<: *spilo-env
      RESTAPI_CONNECT_ADDRESS: pg3:8008
      PG_CONNECT_ADDRESS: pg3:5432
    ports:
      - '5435:5432'
      - '8003:8008'
    volumes:
      - ./docker/docker-data/postgres/pg3-data:/home/postgres/pgdata

  # ======================================
  # HAPROXY - route write -> leader, read -> replicas
  # host 5432 -> write endpoint (keep old DATABASE_URL)
  # ======================================
  haproxy:
    image: haproxy:3.0
    container_name: pg-haproxy
    restart: unless-stopped
    networks:
      - nest_network
    ports:
      - '5432:5000' # write: primary only (app/Prisma dùng localhost:5432)
      - '5011:5001' # read: replicas only
      - '7010:7000' # HAProxy stats (7010 tránh macOS AirPlay 7000)
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pg1
      - pg2
      - pg3

  # ======================================
  # IVORY - Patroni/Postgres cluster management UI
  # http://localhost:8085 — auto-setup on container start (cluster + postgres creds)
  # ======================================
  ivory:
    build:
      context: .
      dockerfile: docker/ivory/Dockerfile
    image: letgogobi/ivory:latest
    platform: linux/amd64
    container_name: ivory
    restart: unless-stopped
    networks:
      - nest_network
    ports:
      - '8085:80'
    volumes:
      - ./docker/docker-data/ivory/data:/opt/ivory/data
    environment:
      IVORY_URL: http://localhost:80
      IVORY_CLUSTER_NAME: letgogobi
      IVORY_PATRONI_HOST: pg1
      IVORY_PATRONI_PORT: '8008'
      IVORY_PG_USER: postgres
      IVORY_PG_PASSWORD: postgres
    depends_on:
      - pg1
      - pg2
      - pg3
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --silent --fail http://localhost:80/api/ping || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  debezium-connect:
    build:
      context: ./debezium
      dockerfile: Dockerfile
    image: letgogobi/debezium-connect:3.6.0.Final
    container_name: debezium-connect
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
      haproxy:
        condition: service_started
    ports:
      - '8083:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect-cluster
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'

      OFFSET_FLUSH_INTERVAL_MS: 10000
      ENABLE_DEBEZIUM_SCRIPTING: 'true'
      ENABLE_APICURIO_CONVERTERS: 'true'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --silent --fail http://localhost:8083/connectors || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - nest_network

# ======================================
# NETWORK
# ======================================
networks:
  nest_network:
    name: nest_network
    driver: bridge
