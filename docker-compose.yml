services:
  # ======================================
  # KAFKA (Apache Kafka, KRaft mode, 2 listeners)
  # ======================================
  kafka:
    container_name: kafka
    image: apache/kafka:latest
    restart: always
    ports:
      - '9094:9094' # external listener
    environment:
      # --- Node identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # --- LISTENERS ---
      # INTERNAL → for Kafka-UI and services in Docker
      # EXTERNAL → for NestJS / KafkaJS to run from HOST machine
      # CONTROLLER → requested by KRaft
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://:9093

      # Advertised listeners = Kafka tells the client where to connect
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Kafka broker use INTERNAL listener
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Controller config
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # KRaft log directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Topics config
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka-entrypoint.sh:/kafka-entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/kafka-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nest_network

  # ======================================
  # KAFKA UI
  # ======================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: 'false'
      KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE: 'true'
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
    depends_on:
      kafka:
        condition: service_healthy
      debezium-connect:
        condition: service_healthy
    networks:
      - nest_network

  # ======================================
  # REDIS
  # ======================================
  redis2:
    container_name: redis2 # host connect redis-insight
    image: redis:8.4.0-alpine
    restart: always
    command: sh /redis-init.sh
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
      - ./redis-init.sh:/redis-init.sh:ro
    environment:
      - REDIS_USERNAME=redis-user
      - REDIS_PASSWORD=redis-password
    networks:
      - nest_network

  # ======================================
  # REDIS INSIGHT
  # ======================================
  redis-insight2:
    container_name: redis-insight2
    image: redislabs/redisinsight:latest
    ports:
      - 5540:5540
    volumes:
      - redis_insight:/data
    restart: always
    depends_on:
      - redis2
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:5540 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nest_network
    environment:
      - REDISINSIGHT_DISABLE_AUTH=true
      - REDISINSIGHT_PASSWORD=redis-password
      - REDISINSIGHT_USERNAME=redis-user
      - REDISINSIGHT_REDIS_URL=redis:6379
      - REDISINSIGHT_REDIS_PASSWORD=redis-password
      - REDISINSIGHT_REDIS_USERNAME=redis-user

  # ======================================
  # POSTGRES REPLICATION CLUSTER (1 primary + 2 replicas)
  # pg-primary is the application database (replaces the old `database2`):
  # same DB/user/port so DATABASE_URL and Prisma keep working unchanged.
  # wal_level=logical -> serves BOTH physical streaming replication
  # AND Debezium logical decoding (CDC) from the same primary.
  # Reuses the proven scripts from replication/ via read-only mounts
  # (those files are not modified).
  # ======================================
  pg-primary:
    container_name: pg-primary
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kafka_hqh
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      REPL_USER: repluser
      REPL_PASSWORD: replpass
    ports:
      - '5432:5432'
    env_file:
      - .env
    command:
      - postgres
      - '-c'
      - 'listen_addresses=*'
      - '-c'
      - 'wal_level=logical'
      - '-c'
      - 'max_wal_senders=10'
      - '-c'
      - 'max_replication_slots=10'
      - '-c'
      - 'hot_standby=on'
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./replication/primary/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgresql -d kafka_hqh']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nest_network

  pg-replica1:
    container_name: pg-replica1
    image: postgres:16-alpine
    restart: always
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      PRIMARY_HOST: pg-primary
      PRIMARY_PORT: '5432'
      REPL_USER: repluser
      REPL_PASSWORD: replpass
      APP_NAME: replica1
      SLOT_NAME: replica1_slot
    ports:
      - '5543:5432'
    entrypoint: ['/bin/bash', '/replica-entrypoint.sh']
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
      - ./replication/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    networks:
      - nest_network

  pg-replica2:
    container_name: pg-replica2
    image: postgres:16-alpine
    restart: always
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      PRIMARY_HOST: pg-primary
      PRIMARY_PORT: '5432'
      REPL_USER: repluser
      REPL_PASSWORD: replpass
      APP_NAME: replica2
      SLOT_NAME: replica2_slot
    ports:
      - '5544:5432'
    entrypoint: ['/bin/bash', '/replica-entrypoint.sh']
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
      - ./replication/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    networks:
      - nest_network

  debezium-connect:
    build:
      context: ./debezium
      dockerfile: Dockerfile
    image: letgogobi/debezium-connect:3.6.0.Final
    container_name: debezium-connect
    depends_on:
      kafka:
        condition: service_healthy
      pg-primary:
        condition: service_healthy
    ports:
      - '8083:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect-cluster
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'

      OFFSET_FLUSH_INTERVAL_MS: 10000
      ENABLE_DEBEZIUM_SCRIPTING: 'true'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --silent --fail http://localhost:8083/connectors || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - nest_network

# ======================================
# VOLUMES
# ======================================
volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local
  redis_insight:
    driver: local
  pg_primary_data:
    driver: local
  pg_replica1_data:
    driver: local
  pg_replica2_data:
    driver: local

# ======================================
# NETWORK
# ======================================
networks:
  nest_network:
    name: nest_network
    driver: bridge
